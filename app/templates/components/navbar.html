
<nav class="navbar">

    <a href="{{ url_for('home.index') }}" class="logo">
        <span class="logo-icon">C</span>
        Cyber<span>Site</span>
    </a>

    <div class="nav-links">
        {% set page = request.blueprint if request else '' %}
        <a href="{{ url_for('home.index') }}"{% if request.endpoint == 'home.index' %} class="active" aria-current="page"{% endif %}>خانه</a>
        <a href="{{ url_for('products.index') }}"{% if page == 'products' %} class="active" aria-current="page"{% endif %}>فروشگاه</a>
        <a href="{{ url_for('shop.cart') }}" class="nav-cart{% if page == 'shop' %} active{% endif %}">
            سبد خرید{% if cart_item_count %}<span class="cart-badge">{{ cart_item_count }}</span>{% endif %}
        </a>
        <a href="{{ url_for('blog.index') }}"{% if page == 'blog' %} class="active" aria-current="page"{% endif %}>وبلاگ</a>
        <a href="{{ url_for('home.about') }}"{% if request.endpoint == 'home.about' %} class="active" aria-current="page"{% endif %}>درباره من</a>
        <a href="{{ url_for('contact.index') }}"{% if page == 'contact' %} class="active" aria-current="page"{% endif %}>تماس با من</a>
    </div>

    <div class="nav-actions">
        <button class="theme-toggle" type="button" data-theme-toggle
                aria-label="تغییر پوسته روشن/تیره" title="تغییر پوسته">
            <span class="icon-sun" aria-hidden="true">☀</span>
            <span class="icon-moon" aria-hidden="true">☾</span>
        </button>

        {% if customer %}
            <a href="{{ url_for('customers.dashboard') }}" class="nav-login">حساب من</a>
        {% else %}
            <a href="{{ url_for('customers.login') }}" class="nav-login">ورود / ثبت‌نام</a>
        {% endif %}

        <a href="{{ url_for('admin.index') }}" class="nav-login">
            مدیریت
        </a>
    </div>

</nav>
