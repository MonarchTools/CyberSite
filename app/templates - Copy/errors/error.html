{% extends "base.html" %}

{% block title %}{{ title }} | CyberSite{% endblock %}

{% block content %}
<section class="placeholder-page error-page">
    <div class="hero-badge">
        <span class="status-dot"></span>
        ERROR {{ code }}
    </div>

    <h1>{{ title }}</h1>

    <p>{{ message }}</p>

    <a href="{{ url_for('home.index') }}" class="btn-primary">
        بازگشت به خانه
    </a>
</section>
{% endblock %}
